name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check app tests

      - name: Unit tests
        run: pytest tests/unit -v --cov=app --cov-report=term-missing

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-test
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -f infra/docker/Dockerfile -t groundcontrol-api:ci .

      - name: Smoke-test the image starts and serves /healthz
        run: |
          docker run -d --name gc-smoke -p 8000:8000 groundcontrol-api:ci
          for i in $(seq 1 20); do
            if curl -sf http://localhost:8000/healthz; then exit 0; fi
            sleep 1
          done
          echo "container failed to become healthy"
          docker logs gc-smoke
          exit 1
