[project]
name = "groundcontrol"
version = "0.1.0"
description = "Self-correcting agentic RAG platform where evaluation metrics gate answers at request time."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pgvector>=0.3",
    "redis>=5.0",
    "arq>=0.26",
    "httpx>=0.27",
    "sentence-transformers>=3.0",
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "ragas>=0.2",
    "pypdf>=4.3",
    "python-docx>=1.1",
    "beautifulsoup4>=4.12",
    "prometheus-client>=0.20",
    "structlog>=24.1",
    "tenacity>=8.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "httpx>=0.27",
    "asgi-lifespan>=2.1",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
