services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-groundcontrol}
      POSTGRES_USER: ${POSTGRES_USER:-groundcontrol}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-groundcontrol}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-groundcontrol}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  langfuse:
    image: langfuse/langfuse:2
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-groundcontrol}:${POSTGRES_PASSWORD:-groundcontrol}@postgres:5432/langfuse
      NEXTAUTH_SECRET: dev-secret-change-me
      NEXTAUTH_URL: http://localhost:3000
      SALT: dev-salt-change-me
    ports:
      - "3000:3000"

  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-groundcontrol}:${POSTGRES_PASSWORD:-groundcontrol}@postgres:5432/${POSTGRES_DB:-groundcontrol}
      REDIS_URL: redis://redis:6379/0
      OLLAMA_BASE_URL: http://ollama:11434
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app

  worker:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
    command: ["arq", "app.ingestion.worker.WorkerSettings"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-groundcontrol}:${POSTGRES_PASSWORD:-groundcontrol}@postgres:5432/${POSTGRES_DB:-groundcontrol}
      REDIS_URL: redis://redis:6379/0
      OLLAMA_BASE_URL: http://ollama:11434

volumes:
  pg_data:
  ollama_data:
